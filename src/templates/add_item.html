{% extends "base.html" %}

{% block title %}Add Item - MyCloset{% endblock %}

{% block content %}

<div class="form-container">

    <h1>Add Clothing Item</h1>

    <p class="subtitle">
        Add a new piece to your digital wardrobe.
    </p>

    <form action="/add" method="POST" class="clothing-form">

        <div class="form-group">

            <label for="name">
                Item Name
            </label>

            <input
                type="text"
                id="name"
                name="name"
                placeholder="e.g. Black T-Shirt"
                required
            >

        </div>


        <div class="form-group">

            <label for="category">
                Category
            </label>

            <select
                id="category"
                name="category"
                required
            >

                <option value="">
                    Select a category
                </option>

                <option value="Tops">
                    Tops
                </option>

                <option value="Bottoms">
                    Bottoms
                </option>

                <option value="One-Piece">
                    One-Piece
                </option>

                <option value="Outerwear">
                    Outerwear
                </option>

                <option value="Shoes">
                    Shoes
                </option>

                <option value="Accessories">
                    Accessories
                </option>

            </select>

        </div>


        <div class="form-group">

            <label for="item_type">
                Type
            </label>

            <select
                id="item_type"
                name="item_type"
                required
                disabled
            >

                <option value="">
                    Select a category first
                </option>

            </select>

        </div>


        <div class="form-group">

            <label for="occasion">
                Occasion
            </label>

            <select
                id="occasion"
                name="occasion"
                required
            >

                <option value="">
                    Select an occasion
                </option>

                <option value="Casual">
                    Casual
                </option>

                <option value="Formal">
                    Formal
                </option>

                <option value="Party">
                    Party
                </option>

                <option value="Sports">
                    Sports
                </option>

                <option value="Work">
                    Work
                </option>

            </select>

        </div>


        <div class="form-group">

            <label for="color">
                Color
            </label>

            <input
                type="text"
                id="color"
                name="color"
                placeholder="e.g. Black"
                required
            >

        </div>


        <div class="form-group">

            <label for="season">
                Season
            </label>

            <select
                id="season"
                name="season"
                required
            >

                <option value="">
                    Select a season
                </option>

                <option value="Spring">
                    Spring
                </option>

                <option value="Summer">
                    Summer
                </option>

                <option value="Autumn">
                    Autumn
                </option>

                <option value="Winter">
                    Winter
                </option>

                <option value="All Season">
                    All Season
                </option>

            </select>

        </div>


        <button
            type="submit"
            class="add-button"
        >
            Add to MyCloset
        </button>

    </form>

</div>


<script>

    const categorySelect = document.getElementById("category");

    const typeSelect = document.getElementById("item_type");


    const categoryTypes = {

        "Tops": [
            "T-Shirt",
            "Shirt",
            "Blouse",
            "Sweater",
            "Hoodie"
        ],

        "Bottoms": [
            "Jeans",
            "Trousers",
            "Shorts",
            "Skirt"
        ],

        "One-Piece": [
            "Dress",
            "Jumpsuit"
        ],

        "Outerwear": [
            "Jacket",
            "Coat",
            "Blazer"
        ],

        "Shoes": [
            "Sneakers",
            "Boots",
            "Sandals",
            "Formal Shoes"
        ],

        "Accessories": [
            "Bag",
            "Scarf",
            "Hat",
            "Belt",
            "Jewelry"
        ]

    };


    categorySelect.addEventListener("change", function () {

        const selectedCategory = categorySelect.value;

        typeSelect.innerHTML = "";

        if (selectedCategory === "") {

            typeSelect.disabled = true;

            const option = document.createElement("option");

            option.value = "";

            option.textContent = "Select a category first";

            typeSelect.appendChild(option);

            return;
        }


        typeSelect.disabled = false;


        const defaultOption = document.createElement("option");

        defaultOption.value = "";

        defaultOption.textContent = "Select a type";

        typeSelect.appendChild(defaultOption);


        categoryTypes[selectedCategory].forEach(function (type) {

            const option = document.createElement("option");

            option.value = type;

            option.textContent = type;

            typeSelect.appendChild(option);

        });

    });

</script>

{% endblock %}
